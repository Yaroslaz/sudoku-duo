<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Обновление Sudoku duo</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fff;
        color: #273244;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(100%, 360px); text-align: center; }
      .spinner {
        width: 42px;
        height: 42px;
        margin: 0 auto 18px;
        border: 4px solid #e7edf5;
        border-top-color: #316ab1;
        border-radius: 50%;
        animation: spin .75s linear infinite;
      }
      h1 { margin: 0 0 8px; font-size: 1.35rem; }
      p { margin: 0; color: #737d8e; line-height: 1.45; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main>
      <div class="spinner" aria-hidden="true"></div>
      <h1>Обновляю Sudoku duo</h1>
      <p>Сохранённые партии останутся на месте.</p>
    </main>
    <script>
      (async () => {
        const targetVersion = '1.3.0';
        try {
          if ('serviceWorker' in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(
              registrations
                .filter((registration) => registration.scope.includes('/sudoku-duo/'))
                .map((registration) => registration.unregister()),
            );
          }

          if ('caches' in window) {
            const keys = await caches.keys();
            await Promise.all(
              keys
                .filter((key) => key.startsWith('sudoku-duo-'))
                .map((key) => caches.delete(key)),
            );
          }
        } catch {
          // Even if cleanup is partial, the unique target URL below bypasses old cache entries.
        }

        const next = new URL('./', window.location.href);
        next.searchParams.set('v', targetVersion);
        next.searchParams.set('fresh', Date.now().toString(36));
        window.location.replace(next.toString());
      })();
    </script>
  </body>
</html>
