name: Unpack project

on:
  push:
    paths:
      - 'bundle/**'
      - '.github/workflows/unpack-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore and verify project archive
        shell: bash
        run: |
          set -euo pipefail
          cat bundle/part* > project.full.b64
          base64 --decode project.full.b64 > project.zip
          unzip -t project.zip
          rm -rf unpack
          mkdir unpack
          unzip -q project.zip -d unpack
          test -f unpack/sudoku-duo/package.json
          test -f unpack/sudoku-duo/src/App.tsx
          test -f unpack/sudoku-duo/.github/workflows/deploy-pages.yml

      - name: Put project files in repository root
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob
          cp -a unpack/sudoku-duo/. .
          rm -rf bundle project.zip.b64 project.full.b64 project.zip unpack
          rm -f .github/workflows/unpack-project.yml

      - name: Commit restored project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add Sudoku Duo app"
          git push

# The second commit ensures the workflow is already present before the push event.
